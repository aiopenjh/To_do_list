<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="팀원 6명의 개인 Todo List를 연결하는 우리 팀 시작 페이지">
  <title>우리 팀 Todo List</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='m8 16 5 5 11-11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; }
    body {
      margin: 0;
      background: #f5f7fb;
      color: #182338;
      font-family: system-ui, -apple-system, "맑은 고딕", sans-serif;
      line-height: 1.6;
    }
    a { color: inherit; }
    .page { width: min(100% - 40px, 1000px); margin: auto; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 28px 0;
      border-bottom: 1px solid #e2e7ef;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .brand-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: #2563eb;
      color: white;
    }
    .team-count { color: #637087; font-size: .875rem; }
    main { padding: 60px 0 48px; }
    .intro { margin-bottom: 34px; }
    .eyebrow {
      margin: 0 0 10px;
      color: #2563eb;
      font-size: .875rem;
      font-weight: 700;
      letter-spacing: .08em;
    }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 2.75rem); line-height: 1.3; letter-spacing: -.04em; }
    .intro > p:last-child { margin: 14px 0 0; color: #637087; }
    .members { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 26px;
      background: #fff;
      border: 1px solid #e2e7ef;
      border-radius: 16px;
      transition: border-color .18s, transform .18s;
    }
    .card:hover { border-color: #b3c7ef; transform: translateY(-3px); }
    .member-number {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin-bottom: 22px;
      border-radius: 14px;
      background: #edf3ff;
      color: #2563eb;
      font-weight: 800;
    }
    .card h2 { margin: 0; font-size: 1.25rem; overflow-wrap: anywhere; }
    .card p { margin: 5px 0 24px; color: #637087; font-size: .875rem; }
    .todo-link {
      display: block;
      width: 100%;
      margin-top: auto;
      padding: 11px 12px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-size: .875rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .todo-link:hover { background: #1d4ed8; }
    .todo-link:focus-visible { outline: 3px solid #182338; outline-offset: 4px; }
    .todo-link:disabled { background: #eff2f7; color: #6b7587; cursor: default; }
    footer { padding: 24px 0 32px; border-top: 1px solid #e2e7ef; color: #637087; font-size: .875rem; }
    @media (max-width: 760px) { .members { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 480px) {
      .page { width: calc(100% - 32px); }
      header { padding: 22px 0; }
      main { padding-top: 38px; }
      .members { grid-template-columns: 1fr; gap: 14px; }
      .card { padding: 24px; }
    }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">✓</span>
        <span>TEAM TODO</span>
      </div>
      <span class="team-count">6명의 팀원</span>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">OUR TEAM PROJECT</p>
        <h1 id="page-title">우리 팀 Todo List</h1>
      </section>
      <section class="members" id="members" aria-label="팀원별 Todo List"></section>
      <noscript><p>팀원 목록을 보려면 브라우저에서 JavaScript를 켜주세요.</p></noscript>
    </main>

    <footer>Todo List</footer>
  </div>

  <script>
    // 아래 6명의 name과 url만 수정하면 됩니다.
    // 같은 폴더의 파일 연결: url: "./member1.html"
    // 웹페이지 연결: url: "https://실제-Todo-페이지-주소"
    // url을 비워두면 버튼이 비활성화됩니다.
    const members = [
      { name: "선병철", url: "./sbc/index.html" },
      { name: "이영민", url: "./lym/index.html" },
      { name: "정학용", url: "./jhy/index.html" },
      { name: "조성아", url: "./jsa/index.html" },
      { name: "최규형", url: "./ckh/index.html" },
      { name: "최지훈", url: "./cjh/index.html" }
    ];

    const memberList = document.getElementById("members");
    members.forEach((member, index) => {
      const card = document.createElement("article");
      card.className = "card";

      const number = document.createElement("span");
      number.className = "member-number";
      number.textContent = String(index + 1).padStart(2, "0");
      number.setAttribute("aria-hidden", "true");

      const name = document.createElement("h2");
      name.textContent = member.name;

      const description = document.createElement("p");
      description.textContent = "개인 Todo List";

      const url = member.url.trim();
      const link = document.createElement(url ? "a" : "button");
      link.className = "todo-link";
      if (url) {
        link.href = url;
        link.textContent = "Todo List 열기";
        link.setAttribute("aria-label", `${member.name}의 Todo List 열기`);
      } else {
        link.type = "button";
        link.disabled = true;
        link.textContent = "연결 준비 중";
      }

      card.append(number, name, description, link);
      memberList.append(card);
    });
  </script>
</body>
</html>
